
name: Update ZEYA Alliance Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch alliance data
        env:
          API_KEY: ${{ secrets.LAST_ASYLUM_API_KEY }}
        run: |
          mkdir -p data
          curl -fsS \
           -H "User-Agent: ZEYA-Guild-Site/1.0" \
           -H "Authorization: Bearer ${API_KEY}" \
            "https://api.lastasylumtracker.com/v1/alliances/271/ZEYA" \
            -o data/alliance.json
          jq -e . data/alliance.json > /dev/null

      - name: Save updated data
        run: |
          git config user.name "ZEYA Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alliance.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ZEYA alliance data"
            git push
          fi
